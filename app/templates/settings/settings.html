{% extends "app_base.html" %}
{% block title %}Settings — {{ site_name }}{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <h1>Settings</h1>
    <p class="muted">{{ current_user.full_name }} · {{ current_user.email }}</p>
  </div>
</header>

<section class="panel">
  <h2>Colors</h2>
  <div class="theme-picks">
    {% for item in themes %}
    <form method="post" action="/theme">
      <input type="hidden" name="theme" value="{{ item }}">
      <input type="hidden" name="next" value="/settings">
      <button type="submit" class="theme-pick {% if theme == item %}is-on{% endif %}" data-theme-preview="{{ item }}">{{ item|title }}</button>
    </form>
    {% endfor %}
  </div>
</section>

<section class="panel">
  <h2>Password</h2>
  <p><a class="btn" href="/settings/password">Change password</a></p>
</section>
{% endblock %}
